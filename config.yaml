# ============================================================
#  Configuração do canal "Transmissões Católicas" (público do Brasil)
#  Podes editar este ficheiro diretamente no GitHub (ícone do lápis ✏️).
# ============================================================

canal:
  nome: "Transmissões Católicas"           # aparece no topo do vídeo
  chamada_final: "Inscreva-se no canal e reze conosco."
  convite_oracao: "Reze conosco"           # aparece nos vídeos de oração

voz:
  # Vozes do Microsoft Edge (gratuitas):
  #   Brasil:   pt-BR-AntonioNeural (masculina) | pt-BR-FranciscaNeural (feminina) | pt-BR-ThalitaMultilingualNeural
  #   Portugal: pt-PT-DuarteNeural | pt-PT-RaquelNeural
  nome: "pt-BR-AntonioNeural"
  velocidade: "-3%"                        # um pouco mais pausada, para oração
  nome_oracao: "pt-BR-FranciscaNeural"     # voz das orações

ia:
  # Modelos Gemini tentados por ordem (se um falhar ou esgotar a quota, passa ao seguinte)
  modelos:
    - "gemini-3.8-flash"
    - "gemini-3.5-flash-lite"
    - "gemini-3.1-flash-lite"

idioma:
  liturgia: "BR"            # "BR" = Liturgia Diária da CNBB (Brasil) | "PT" = Evangelho Quotidiano (Portugal)
  wikipedia: "pt"
  variante: "português do Brasil"     # como a IA deve escrever
  pais: "Brasil"                      # público principal do canal
  fuso: "America/Sao_Paulo"           # hora de Brasília (os horários abaixo estão neste fuso)

agenda:
  # Publicação automática (hora de Brasília). Cada horário tem o seu formato:
  #   evangelho | santo | oracao | musica | papa | leitura
  # Se um formato não tiver conteúdo novo, o sistema usa outro (ver "reserva").
  horarios:
    - { hora: "06:07", formato: "evangelho" }   # para quem reza logo cedo
    - { hora: "09:07", formato: "santo" }
    - { hora: "12:07", formato: "papa" }        # Palavra do Papa / Igreja no Brasil
    - { hora: "15:07", formato: "musica" }
    - { hora: "18:07", formato: "oracao" }      # hora da Ave-Maria / Angelus
    - { hora: "21:07", formato: "musica" }
  reserva: ["leitura", "oracao", "musica", "santo"]

imagens:
  quantidade: 5                 # nº de imagens (arte sacra em domínio público) por vídeo narrado
  quantidade_musica: 8          # nº de imagens nos vídeos de música

musica:
  # Música sacra com licença livre (domínio público / CC) do Wikimedia Commons.
  # Nada de músicas comerciais: evitam-se reclamações de direitos de autor e "strikes".
  duracao_max: 150              # segundos de música por vídeo (Shorts até 3 min)
  duracao_min_peca: 50          # ignora gravações mais curtas do que isto
  musica_de_fundo: true         # música suave por baixo da narração (volume baixo)
  pesquisas:
    - { q: "Ave Maria Schubert", tema: "Virgin Mary painting" }
    - { q: "Ave Maria Gounod", tema: "Madonna painting Raphael" }
    - { q: "Ave Maria Arcadelt", tema: "Annunciation painting" }
    - { q: "Ave Maria Caccini", tema: "Virgin Mary painting Murillo" }
    - { q: "Ave verum corpus", tema: "Eucharist painting" }
    - { q: "Panis angelicus", tema: "Last Supper painting" }
    - { q: "Agnus Dei Palestrina", tema: "Lamb of God painting" }
    - { q: "Agnus Dei Byrd", tema: "Crucifixion painting" }
    - { q: "Kyrie gregorian", tema: "Christ Pantocrator mosaic" }
    - { q: "Pange lingua", tema: "Eucharistic adoration monstrance" }
    - { q: "Tantum ergo", tema: "monstrance Blessed Sacrament" }
    - { q: "Salve Regina", tema: "Coronation of the Virgin painting" }
    - { q: "Regina caeli", tema: "Resurrection of Christ painting" }
    - { q: "Magnificat", tema: "Visitation painting" }
    - { q: "Stabat Mater", tema: "Pieta painting" }
    - { q: "Miserere Allegri", tema: "Sistine Chapel ceiling" }
    - { q: "Veni Creator", tema: "Pentecost painting" }
    - { q: "Adeste fideles", tema: "Nativity painting" }
    - { q: "Gloria Vivaldi", tema: "angels painting" }
    - { q: "Laudate Dominum Mozart", tema: "angels choir painting" }
    - { q: "Jesu joy of man's desiring", tema: "Christ painting" }
    - { q: "Bach chorale prelude organ", tema: "cathedral interior" }
    - { q: "Mass in B minor Bach", tema: "cathedral nave" }
    - { q: "Requiem Mozart Lacrimosa", tema: "Lamentation of Christ painting" }
    - { q: "Gregorian chant", tema: "monastery cloister" }
    - { q: "Ave maris stella", tema: "Virgin Mary star of the sea" }
    - { q: "Te Deum", tema: "cathedral interior baroque" }
    - { q: "Benedictus", tema: "Baptism of Christ painting" }
  fundo:                         # pesquisas para a música de fundo (instrumental)
    - "organ chorale prelude"
    - "Bach organ prelude"
    - "Pachelbel canon"
    - "Air on the G String"
    - "harp instrumental"
    - "Ave Maria violin"

papa:
  horas_max: 72                 # só notícias dos últimos 3 dias
  palavras: "130 a 200"         # tamanho da narração (cerca de 1 a 1,5 minutos)
  prioridade: "palavras do Papa (Angelus, audiência geral, homilia, mensagem), depois a Igreja no Brasil (CNBB, Aparecida, dioceses brasileiras, grandes celebrações e romarias), depois grandes acontecimentos da Igreja no mundo"
  fontes:
    - { nome: "Vatican News",      url: "https://www.vaticannews.va/pt.rss.xml" }
    - { nome: "CNBB",              url: "https://www.cnbb.org.br/feed/" }
    - { nome: "Canção Nova",       url: "https://noticias.cancaonova.com/feed/" }
    - { nome: "Aleteia",           url: "https://pt.aleteia.org/feed/" }
    - { nome: "ACI Digital",       url: "https://www.acidigital.com/rss/rss.php" }

youtube:
  # modo:
  #   "publico"  -> publica de imediato
  #   "agendado" -> envia como privado e publica sozinho depois de X horas
  #   "privado"  -> fica privado; publicas tu no YouTube Studio
  modo: "publico"
  horas_revisao: 1
  categoria: "22"               # 22 = Pessoas e blogs (a música usa 10 = Música)
  idioma: "pt-BR"
  marcar_conteudo_sintetico: false
  notificar_inscritos: false
