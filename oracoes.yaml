# Orações tradicionais (versões usadas no Brasil) para os vídeos de oração.
# Podes acrescentar orações: "titulo", "texto" e "imagens" (pesquisas em inglês no Wikimedia Commons).

- id: pai-nosso
  titulo: "Pai Nosso"
  imagens: ["Sermon on the Mount painting", "Christ praying painting", "Jesus teaching painting"]
  texto: >-
    Pai nosso que estais nos céus, santificado seja o vosso nome; venha a nós o vosso reino;
    seja feita a vossa vontade, assim na terra como no céu. O pão nosso de cada dia nos dai hoje;
    perdoai-nos as nossas ofensas, assim como nós perdoamos a quem nos tem ofendido;
    e não nos deixeis cair em tentação, mas livrai-nos do mal. Amém.

- id: ave-maria
  titulo: "Ave Maria"
  imagens: ["Annunciation painting", "Virgin Mary painting", "Our Lady of Aparecida"]
  texto: >-
    Ave Maria, cheia de graça, o Senhor é convosco; bendita sois vós entre as mulheres,
    e bendito é o fruto do vosso ventre, Jesus. Santa Maria, Mãe de Deus, rogai por nós, pecadores,
    agora e na hora de nossa morte. Amém.

- id: salve-rainha
  titulo: "Salve Rainha"
  imagens: ["Coronation of the Virgin painting", "Madonna of Mercy painting", "Basilica of Aparecida"]
  texto: >-
    Salve, Rainha, Mãe de misericórdia, vida, doçura e esperança nossa, salve! A vós bradamos,
    os degredados filhos de Eva; a vós suspiramos, gemendo e chorando neste vale de lágrimas.
    Eia, pois, advogada nossa, esses vossos olhos misericordiosos a nós volvei; e, depois deste desterro,
    mostrai-nos Jesus, bendito fruto do vosso ventre, ó clemente, ó piedosa, ó doce sempre Virgem Maria.
    Rogai por nós, Santa Mãe de Deus, para que sejamos dignos das promessas de Cristo. Amém.

- id: consagracao-nossa-senhora
  titulo: "Consagração a Nossa Senhora"
  imagens: ["Our Lady of Aparecida", "Immaculate Conception painting Murillo", "Virgin Mary painting"]
  texto: >-
    Ó minha Senhora, ó minha Mãe, eu me ofereço todo a vós, e, em prova da minha devoção para convosco,
    vos consagro neste dia os meus olhos, os meus ouvidos, a minha boca, o meu coração e inteiramente todo o meu ser.
    E porque assim sou vosso, ó incomparável Mãe, guardai-me e defendei-me como coisa e propriedade vossa. Amém.

- id: anjo-de-fatima
  titulo: "Oração do Anjo de Fátima"
  imagens: ["Fatima sanctuary", "Our Lady of Fatima statue", "Chapel of the Apparitions Fatima"]
  texto: >-
    Meu Deus, eu creio, adoro, espero e amo-vos. Peço-vos perdão para os que não creem, não adoram,
    não esperam e não vos amam. Meu Deus, eu creio, adoro, espero e amo-vos. Peço-vos perdão para os que
    não creem, não adoram, não esperam e não vos amam. Meu Deus, eu creio, adoro, espero e amo-vos.
    Peço-vos perdão para os que não creem, não adoram, não esperam e não vos amam.

- id: o-meu-jesus
  titulo: "Ó meu Jesus (oração de Fátima)"
  imagens: ["Sacred Heart of Jesus painting", "Fatima sanctuary", "rosary"]
  texto: >-
    Ó meu Jesus, perdoai-nos, livrai-nos do fogo do inferno, levai as almas todas para o céu
    e socorrei principalmente as que mais precisarem.

- id: anjo-da-guarda
  titulo: "Oração ao Anjo da Guarda"
  imagens: ["guardian angel painting", "angel painting baroque"]
  texto: >-
    Santo Anjo do Senhor, meu zeloso guardador, se a ti me confiou a piedade divina,
    sempre me rege, me guarda, me governa e me ilumina. Amém.

- id: sao-miguel
  titulo: "Oração a São Miguel Arcanjo"
  imagens: ["Saint Michael archangel painting", "Michael archangel Guido Reni", "Saint Michael statue"]
  texto: >-
    São Miguel Arcanjo, defendei-nos no combate; sede o nosso refúgio contra a maldade e as ciladas do demônio.
    Ordene-lhe Deus, instantemente o pedimos; e vós, príncipe da milícia celeste, pela virtude divina,
    precipitai no inferno a satanás e a todos os espíritos malignos que andam pelo mundo para perder as almas. Amém.

- id: credo
  titulo: "Creio (Símbolo dos Apóstolos)"
  imagens: ["Twelve Apostles painting", "Pentecost painting", "Christ Pantocrator mosaic"]
  texto: >-
    Creio em Deus Pai todo-poderoso, criador do céu e da terra; e em Jesus Cristo, seu único Filho, nosso Senhor;
    que foi concebido pelo poder do Espírito Santo; nasceu da Virgem Maria; padeceu sob Pôncio Pilatos,
    foi crucificado, morto e sepultado; desceu à mansão dos mortos; ressuscitou ao terceiro dia; subiu aos céus,
    está sentado à direita de Deus Pai todo-poderoso, donde há de vir a julgar os vivos e os mortos.
    Creio no Espírito Santo, na santa Igreja Católica, na comunhão dos santos, na remissão dos pecados,
    na ressurreição da carne, na vida eterna. Amém.

- id: ato-de-contricao
  titulo: "Ato de Contrição"
  imagens: ["Return of the Prodigal Son painting", "penitent Saint Peter painting", "confessional church"]
  texto: >-
    Meu Deus, eu me arrependo, de todo o coração, de vos ter ofendido, porque sois tão bom e amável.
    Prometo, com a vossa graça, esforçar-me para ser bom. Meu Jesus, misericórdia!

- id: lembrai-vos
  titulo: "Lembrai-vos (Memorare)"
  imagens: ["Madonna of Mercy painting", "Virgin Mary painting Murillo", "Pieta sculpture"]
  texto: >-
    Lembrai-vos, ó piíssima Virgem Maria, que nunca se ouviu dizer que algum daqueles que têm recorrido
    à vossa proteção, implorado a vossa assistência e reclamado o vosso socorro, fosse por vós desamparado.
    Animado eu, pois, com igual confiança, a vós, ó Virgem entre todas singular, como a Mãe recorro,
    de vós me valho e, gemendo sob o peso dos meus pecados, me prostro a vossos pés.
    Não desprezeis as minhas súplicas, ó Mãe do Verbo de Deus humanado, mas dignai-vos de as ouvir propícia
    e de me alcançar o que vos rogo. Amém.

- id: vinde-espirito-santo
  titulo: "Vinde, Espírito Santo"
  imagens: ["Pentecost painting", "Holy Spirit dove stained glass", "Holy Spirit dove Bernini"]
  texto: >-
    Vinde, Espírito Santo, enchei os corações dos vossos fiéis e acendei neles o fogo do vosso amor.
    Enviai o vosso Espírito e tudo será criado, e renovareis a face da terra. Oremos: Ó Deus, que instruístes
    os corações dos vossos fiéis com a luz do Espírito Santo, concedei-nos que, no mesmo Espírito,
    saibamos o que é reto e gozemos sempre de sua consolação. Por Cristo, Senhor nosso. Amém.

- id: alma-de-cristo
  titulo: "Alma de Cristo"
  imagens: ["Crucifixion painting", "Christ crucified Velazquez", "Eucharist painting"]
  texto: >-
    Alma de Cristo, santificai-me. Corpo de Cristo, salvai-me. Sangue de Cristo, inebriai-me.
    Água do lado de Cristo, lavai-me. Paixão de Cristo, confortai-me. Ó bom Jesus, ouvi-me.
    Dentro de vossas chagas, escondei-me. Não permitais que eu me separe de vós. Do espírito maligno, defendei-me.
    Na hora da minha morte, chamai-me e mandai-me ir para vós, para que com os vossos santos vos louve,
    por todos os séculos dos séculos. Amém.

- id: oracao-pela-paz
  titulo: "Oração pela Paz (atribuída a São Francisco)"
  imagens: ["Saint Francis of Assisi painting", "Saint Francis Giotto", "Assisi basilica"]
  texto: >-
    Senhor, fazei-me instrumento de vossa paz. Onde houver ódio, que eu leve o amor;
    onde houver ofensa, que eu leve o perdão; onde houver discórdia, que eu leve a união;
    onde houver dúvida, que eu leve a fé; onde houver erro, que eu leve a verdade;
    onde houver desespero, que eu leve a esperança; onde houver tristeza, que eu leve a alegria;
    onde houver trevas, que eu leve a luz. Ó Mestre, fazei que eu procure mais consolar que ser consolado;
    compreender que ser compreendido; amar que ser amado. Pois é dando que se recebe,
    é perdoando que se é perdoado, e é morrendo que se vive para a vida eterna.

- id: angelus
  titulo: "O Anjo do Senhor (Angelus)"
  imagens: ["The Angelus Millet", "Annunciation painting Fra Angelico", "Annunciation painting"]
  texto: >-
    O Anjo do Senhor anunciou a Maria. E ela concebeu do Espírito Santo.
    Ave Maria, cheia de graça, o Senhor é convosco; bendita sois vós entre as mulheres, e bendito é o fruto
    do vosso ventre, Jesus. Santa Maria, Mãe de Deus, rogai por nós, pecadores, agora e na hora de nossa morte. Amém.
    Eis aqui a serva do Senhor. Faça-se em mim segundo a vossa palavra.
    Ave Maria, cheia de graça, o Senhor é convosco; bendita sois vós entre as mulheres, e bendito é o fruto
    do vosso ventre, Jesus. Santa Maria, Mãe de Deus, rogai por nós, pecadores, agora e na hora de nossa morte. Amém.
    E o Verbo se fez carne. E habitou entre nós.
    Ave Maria, cheia de graça, o Senhor é convosco; bendita sois vós entre as mulheres, e bendito é o fruto
    do vosso ventre, Jesus. Santa Maria, Mãe de Deus, rogai por nós, pecadores, agora e na hora de nossa morte. Amém.
    Rogai por nós, Santa Mãe de Deus. Para que sejamos dignos das promessas de Cristo.
    Oremos: Infundi, Senhor, como vos pedimos, a vossa graça em nossas almas, para que nós, que, pela anunciação
    do Anjo, viemos ao conhecimento da encarnação de Cristo, vosso Filho, por sua paixão e morte na cruz
    sejamos conduzidos à glória da ressurreição. Pelo mesmo Cristo, Senhor nosso. Amém.

- id: gloria
  titulo: "Glória ao Pai"
  imagens: ["Holy Trinity painting", "Adoration of the Trinity Durer", "angels glory painting"]
  texto: >-
    Glória ao Pai, ao Filho e ao Espírito Santo. Como era no princípio, agora e sempre. Amém.
